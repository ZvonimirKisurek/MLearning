[project]
name = "mle-sprint-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.54.0",
  "celery[redis]>=5.4",
  "httpx>=0.27", "feedparser>=6.0", "beautifulsoup4>=4.12",
  "pydantic>=2.7", "pydantic-settings>=2.3", "pyyaml>=6.0",
  "psycopg[binary,pool]>=3.2", "pgvector>=0.3", "numpy>=1.26",
  "openai>=1.40", "tenacity>=8.5", "anthropic>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "pixeltable-pgserver>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs embedded Postgres (pixeltable-pgserver)"]
