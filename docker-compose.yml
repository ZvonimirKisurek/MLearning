# Local dev stack. In production, point DATABASE_URL at Supabase and drop the `db` service.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlesprint
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Files run once, in lexical order, on first boot of an empty volume.
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  worker: &backend
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/mlesprint
      REDIS_URL: redis://redis:6379/0
    depends_on: [db, redis]
    command: celery -A app.celery_app worker --loglevel=INFO --concurrency=2
    profiles: ["full"]
  beat:
    <<: *backend
    command: celery -A app.celery_app beat --loglevel=INFO
    profiles: ["full"]
volumes:
  pgdata:
