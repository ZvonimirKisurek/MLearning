name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      # Includes the integration tests: they start an embedded Postgres + pgvector, so no service container is needed.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build   # needs no running API: data fetching happens at request time, inside <Suspense>

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the backend image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: mle-sprint-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image starts and imports the app
        run: docker run --rm -e DATABASE_URL=postgresql://x@localhost/x mle-sprint-backend:ci python -c "import app.main, app.celery_app; print('ok')"
      - name: Compose file is valid
        run: cp .env.example .env && docker compose -f docker-compose.prod.yml config -q
